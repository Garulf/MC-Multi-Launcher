name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Run tests
        run: uvx --with tox-uv tox -e "py$(echo '${{ matrix.python }}' | tr -d .)"

  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Garulf/readwright@v0.5.0
        with:
          mode: check
          version: "==0.5.0"
